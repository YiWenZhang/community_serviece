spring:
  application:
    name: community-service
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/community_elder_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: SET time_zone = '+00:00'
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  task:
    scheduling:
      pool:
        size: 4
server:
  forward-headers-strategy: none
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    key-store: ${SERVER_SSL_KEY_STORE:}
    key-store-type: PKCS12
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:}
    key-alias: ${SERVER_SSL_KEY_ALIAS:community-local}
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    csrf:
      enabled: true
app:
  require-https: ${APP_REQUIRE_HTTPS:false}
  ai:
    migrate: ${APP_AI_MIGRATE:true}
    initial-key: ${DEEPSEEK_API_KEY:}
  aes-key: ${APP_AES_KEY:}
  hmac-key: ${APP_HMAC_KEY:}
  key-version: 1
  storage: ${APP_STORAGE:./storage}
  scheduler-enabled: ${APP_SCHEDULER_ENABLED:true}
  public-docs: ${APP_PUBLIC_DOCS:true}
