# Replace the domain, certificate paths and frontend dist path before deployment.
server {
    listen 80;
    server_name community.example.com;
    return 308 https://community.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name community.example.com;
    ssl_certificate /etc/community/fullchain.pem;
    ssl_certificate_key /etc/community/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 21m;
    root /opt/community/frontend/dist;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name community.example.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/community/backend-ca-chain.pem;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
    }
}
